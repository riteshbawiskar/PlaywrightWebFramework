name: auto-fix

# Runs after a ci-run fails on a pull request. Claude reads the failing log, fixes the
# test code, re-runs the suite, and pushes a commit. The push re-triggers ci-run.
# This file takes effect only once it is on main, because workflow_run reads the
# workflow from the default branch.
on:
  workflow_run:
    workflows: ["ci-run"]
    types: [completed]

jobs:
  auto-fix:
    # Only failed pull request runs, only for branches in this repository (secrets are
    # not sent to forks), and only when the pull request was opened by the repo owner.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.login == 'riteshbawiskar'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write      # push the fix commit to the pull request branch
      actions: read        # read the failing run's log
    # One fix at a time per branch, so two failed runs never edit the same files at once.
    concurrency:
      group: auto-fix-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    env:
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
      GH_TOKEN: ${{ secrets.AUTOFIX_TOKEN }}   # PAT: pushes with GITHUB_TOKEN would not re-run CI
    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          token: ${{ secrets.AUTOFIX_TOKEN }}
          fetch-depth: 0

      - name: Stop after three auto-fix attempts in a row
        id: attempts
        run: |
          count=0
          for subject in $(git log -n 10 --format=%s); do
            case "$subject" in
              "auto-fix:"*) count=$((count + 1)) ;;
              *) break ;;
            esac
          done
          echo "Consecutive auto-fix commits on this branch: $count"
          if [ "$count" -ge 3 ]; then
            echo "stop=true" >> "$GITHUB_OUTPUT"
          else
            echo "stop=false" >> "$GITHUB_OUTPUT"
            echo "attempt=$((count + 1))" >> "$GITHUB_OUTPUT"
          fi

      - name: Save the failing log
        if: steps.attempts.outputs.stop == 'false'
        env:
          GH_TOKEN: ${{ secrets.AUTOFIX_TOKEN }}
        run: |
          gh run view "$FAILED_RUN_ID" --log-failed > "$RUNNER_TEMP/failure.log" || true
          # Keep the end of the log: that is where the failing assertion is.
          tail -c 60000 "$RUNNER_TEMP/failure.log" > "$RUNNER_TEMP/failure-tail.log"

      - name: Set up Node
        if: steps.attempts.outputs.stop == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.attempts.outputs.stop == 'false'
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm install -g @anthropic-ai/claude-code

      - name: Ask Claude to fix the failing tests
        if: steps.attempts.outputs.stop == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HEADLESS: 'true'
          PARALLEL: '4'
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          FAILURE_LOG: ${{ runner.temp }}/failure-tail.log
        run: |
          cat > "$RUNNER_TEMP/prompt.txt" <<'PROMPT'
          A pull request CI run failed. The end of its log is in the file named by FAILURE_LOG.

          Your job:
          1. Read the log and find the failing scenario and step.
          2. Fix the cause in the test code: step definitions (src/steps), page objects (src/pages),
             API client (src/api), flows (src/flows), or utilities (src/utils).
          3. Run the suite with: npm run bdd
          4. Repeat until the suite passes, or stop after three tries and explain why.

          Rules:
          - Never skip, tag out, delete, or weaken a scenario, and do not edit src/features or src/test-data.
          - Never edit .github, cucumber.js, package.json, config, or anything under .claude.
          - Do not commit or push. The workflow does that.
          - Keep each change small and explain it in one line.
          PROMPT
          claude -p "$(cat "$RUNNER_TEMP/prompt.txt")" \
            --permission-mode acceptEdits \
            --allowedTools "Read" "Edit" "Write" "Glob" "Grep" "Bash(npm run bdd)" "Bash(npx cucumber-js:*)" "Bash(git diff:*)" "Bash(git status:*)"

      - name: Refuse changes outside the allowed folders
        id: guard
        if: steps.attempts.outputs.stop == 'false'
        run: |
          changed=$(git status --porcelain | awk '{print $2}')
          if [ -z "$changed" ]; then
            echo "Claude made no changes. Nothing to push."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$changed"
          if echo "$changed" | grep -vE '^src/(steps|pages|api|flows|utils)/' ; then
            echo "Changes outside the allowed folders. Discarding them and stopping."
            git checkout -- . && git clean -fd
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push the fix
        if: steps.attempts.outputs.stop == 'false' && steps.guard.outputs.changed == 'true'
        run: |
          git config user.name "claude-autofix"
          git config user.email "claude-autofix@users.noreply.github.com"
          git add -A
          git commit -m "auto-fix: attempt ${{ steps.attempts.outputs.attempt }} for failed run ${{ env.FAILED_RUN_ID }}" \
                     -m "Changes written by Claude Code from the failing ci-run log. Review before merging."
          git push origin "HEAD:${HEAD_BRANCH}"
